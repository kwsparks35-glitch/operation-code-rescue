[/Script/UnrealEd.ProjectPackagingSettings]
; Runtime world construction soft-loads these imported art/character packs from
; C++, so force only runtime folders into packaged builds. The imported demo
; maps/Blueprint samples are deliberately excluded because they carry stale input
; mappings and editor-only rig references that are not part of Code Rescue play.
; 2026-07-01 (Claude): stage the raw gameplay-data files (curriculum, briefings, presets)
; into packaged builds. Without this, FFileHelper reads of Content/CodeRescueData/* fail
; in shipping/packaged games and every data-driven feature silently falls back.
+DirectoriesToAlwaysStageAsUFS=(Path="CodeRescueData")
; New authored art (city kit + characters): cook even when only soft-referenced.
+DirectoriesToAlwaysCook=(Path="/Game/CodeRescueArt")
+DirectoriesToAlwaysCook=(Path="/Game/StarterContent/Props")
+DirectoriesToAlwaysCook=(Path="/Game/StarterContent/Materials")
; 2026-07-02: cook the textures too. Materials were cooked but their texture dependencies were
; not guaranteed in the pak, so StarterContent surfaces (notably the safehouse glass panels) showed
; the missing-texture checkerboard. Cooking the Textures dir removes that for every StarterContent material.
+DirectoriesToAlwaysCook=(Path="/Game/StarterContent/Textures")
+DirectoriesToAlwaysCook=(Path="/Game/StarterContent/Shapes")
