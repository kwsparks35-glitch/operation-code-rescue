[/Script/Engine.RendererSettings]
; Runtime-friendly render settings. The project can still use PBR assets, but
; GameMode disables expensive Lumen/virtual-shadow paths at play start so school
; Macs open to a readable city immediately instead of a black convergence pass.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
; Apple Silicon / Metal readiness: avoid TSR as the packaged default. The
; June 25 character-animation deep dive calls out TSR hardware-limit pressure
; and ghosting on fast-moving zombies; UE CVar values are 2=TAA and 4=TSR.
r.TemporalAA.Upsampling=False
r.AntiAliasingMethod=2

; Software Lumen-capable defaults. Runtime play disables GI/reflections when
; needed for visibility and performance.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
; UE 5.7 maps this CVar to ELumenSoftwareTracingMode; numeric avoids enum-string warnings.
r.Lumen.TraceMeshSDFs=1

; Required by Lumen + by AO/contact shadows on PCG-scattered foliage.
r.GenerateMeshDistanceFields=True

; Per-pixel virtual shadows for Nanite + foliage; replaces the old static-
; shadow path that was disabled while everything was procedural. Runtime play
; still disables VSMs on current procedural/non-Nanite fallback geometry; any
; imported Nanite content must pass the MacNaniteSM6ReviewGate first because M1
; Macs cannot rely on Nanite and SM6 requires newer macOS.
r.Shadow.Virtual.Enable=1

; World is fully runtime-generated, so no baked lighting.
r.AllowStaticLighting=False

; Auto-exposure on so dynamic-range scenes (sky vs. shaded interiors) read
; correctly. The PostProcessVolume in GameMode tunes the bias.

; Hardware RT off; keep Lumen on its software path for Mac compatibility.
r.RayTracing=False

; 2026-07-02 ROOT FIX for the teal/checkerboard surfaces: some imported meshes (the glTF city
; kit, StarterContent props) cook as Nanite, but the StarterContent materials assigned to them are
; NOT compiled with bUsedWithNanite. In a cooked build those materials cannot recompile, so the
; renderer substitutes the checkerboard Default Material (confirmed by LogMaterial "missing
; bUsedWithNanite=True! Default Material will be used in game"). This M1-Mac target already can't
; rely on Nanite (see the VSM note above), so disable Nanite project-wide: every mesh then renders
; through the standard material path and the real concrete/brick/steel/glass surfaces show.
r.Nanite.ProjectEnabled=False
